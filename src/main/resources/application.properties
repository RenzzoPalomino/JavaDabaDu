server.port=8080
spring.application.name=mi-api

spring.datasource.url=jdbc:postgresql://localhost:5432/miapi
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.empresa=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-propio-de-al-menos-32-caracteres}
jwt.expiration-ms=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha